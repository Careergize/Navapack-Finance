# Merged with the exact pinned official upstream/compose.yaml.
services:
  configurator:
    volumes: &app-volumes
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
  backend:
    volumes: *app-volumes
  websocket:
    volumes: *app-volumes
  queue-short:
    volumes: *app-volumes
  queue-long:
    volumes: *app-volumes
  scheduler:
    volumes: *app-volumes
  frontend:
    volumes: *app-volumes
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--header", "Host: finance.localhost", "http://127.0.0.1:8080/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
  db:
    image: ${MARIADB_IMAGE:?Lock an exact MariaDB 11.8 digest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Set local password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--innodb-snapshot-isolation=OFF"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis-cache:
    image: ${REDIS_IMAGE:?Lock Redis digest}
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis-queue:
    image: ${REDIS_IMAGE:?Lock Redis digest}
    platform: linux/amd64
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  site-tool:
    image: ${CUSTOM_IMAGE}:${CUSTOM_TAG}
    pull_policy: never
    platform: linux/amd64
    profiles: ["tools"]
    entrypoint: ["bash"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set local password}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set local password}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./scripts:/opt/finance:ro
volumes:
  logs:
  db-data:
  redis-queue-data:
